<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#efe5d2" />
    <meta name="description" content="MARVELL20 portrait booth" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MARVELL20" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MARVELL20</title>
    <link rel="manifest" href="/marvell20/manifest.json" />
    <link rel="icon" href="icons/marvell-logo-favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/marvell20/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=photobooth-39" />
  </head>
  <body>
    <main class="app-shell" data-view="home" data-format="strip">
      <section class="view view-home" aria-labelledby="home-title">
        <div class="home-center">
          <h1 id="home-title">MARVELL20</h1>
          <p class="home-subtitle">The Memory Garden</p>
          <p class="home-date">15 June - 4 July 2026</p>
          <button class="action action-primary" id="beginButton" type="button">Tap anywhere to begin</button>
          <button class="action action-secondary" id="archiveButton" type="button" hidden>Archive</button>
        </div>
      </section>

      <section class="view view-format" aria-labelledby="format-title">
        <p class="view-label" id="format-title">Choose Format</p>
        <div class="format-options" aria-label="Photo format">
          <button class="format-choice" type="button" data-format-choice="single">
            <span>Single Photo</span>
            <canvas id="singleFormatCanvas" width="400" height="600" aria-hidden="true"></canvas>
          </button>
          <button class="format-choice" type="button" data-format-choice="strip">
            <span>Strip of 4</span>
            <canvas id="stripFormatCanvas" width="240" height="720" aria-hidden="true"></canvas>
          </button>
        </div>
      </section>

      <section class="view view-camera" aria-label="Camera">
        <p class="view-label" id="camera-title" hidden></p>
        <div class="camera-stage" id="cameraStage">
          <canvas id="cameraPreviewCanvas" class="camera-preview" aria-hidden="true"></canvas>
          <video id="cameraVideo" autoplay playsinline muted></video>
          <canvas id="captureCanvas" hidden></canvas>
          <div class="camera-fallback" id="cameraFallback">
            <span>Camera</span>
            <button class="ghost-action" id="sourceButton" type="button">Select Source</button>
          </div>
          <div class="countdown" id="countdown" aria-live="polite"></div>
          <button class="capture-action" id="captureButton" type="button" aria-label="Capture"></button>
        </div>
        <footer class="screen-actions camera-actions">
          <button class="action action-secondary" id="changeCameraButton" type="button">
            Change Camera
          </button>
        </footer>
      </section>

      <section class="view view-review" aria-labelledby="review-title">
        <p class="view-label" id="review-title">Review Your Strip</p>
        <div class="portrait-focus">
          <img id="reviewImage" alt="Selected portrait preview" />
        </div>
        <div class="thumbnail-row" id="reviewGallery" aria-label="Captured portraits"></div>
        <footer class="screen-actions">
          <button class="action action-secondary" id="retakeButton" type="button">Retake</button>
          <button class="action action-primary" id="toneNextButton" type="button">Continue</button>
        </footer>
      </section>

      <section class="view view-tone" aria-labelledby="tone-title">
        <p class="view-label" id="tone-title">Choose Tone</p>
        <div class="portrait-focus">
          <canvas id="toneCanvas" width="1600" height="2400"></canvas>
        </div>
        <div class="visual-options" id="toneControls" aria-label="Tone selection"></div>
        <footer class="screen-actions">
          <button class="action action-primary" id="paperNextButton" type="button">Continue</button>
        </footer>
      </section>

      <section class="view view-paper" aria-labelledby="paper-title">
        <p class="view-label" id="paper-title">Choose Paper</p>
        <div class="portrait-focus">
          <canvas id="paperCanvas" width="1600" height="2400"></canvas>
        </div>
        <div class="visual-options" id="paperControls" aria-label="Paper selection"></div>
        <footer class="screen-actions">
          <button class="action action-primary" id="finalNextButton" type="button">Continue</button>
        </footer>
      </section>

      <section class="view view-final" aria-labelledby="final-title">
        <p class="view-label" id="final-title">Strip Ready</p>
        <div class="portrait-focus final-focus">
          <canvas id="finalCanvas" width="1600" height="2400"></canvas>
          <img id="finalGifPreview" alt="" hidden />
        </div>
        <footer class="screen-actions final-actions">
          <button class="action action-primary" id="exportButton" type="button">High Quality</button>
          <button class="action action-secondary" id="airdropButton" type="button">AirDrop</button>
          <button class="action action-secondary" id="gifButton" type="button">GIF</button>
          <button class="action action-secondary" id="startAgainButton" type="button">Start Again</button>
        </footer>
      </section>

      <section class="view view-scan" aria-labelledby="scan-title">
        <p class="view-label" id="scan-title">Scan to Save</p>
        <div class="cloud-qr" aria-live="polite">
          <canvas id="qrCanvas" width="260" height="260" hidden></canvas>
          <p id="qrStatus">Preparing Cloudinary link...</p>
        </div>
        <footer class="screen-actions scan-actions">
          <button class="action action-secondary" id="scanBackButton" type="button">Back</button>
          <button class="action action-primary" id="scanStartAgainButton" type="button">Start Again</button>
        </footer>
      </section>

      <section class="view view-archive" aria-labelledby="archive-title">
        <p class="view-label" id="archive-title">Archive</p>
        <div class="archive-stage">
          <div class="archive-preview">
            <img id="archivePreviewImage" alt="Archived portrait preview" hidden />
            <p id="archiveEmpty">No portraits yet.</p>
          </div>
          <div class="archive-grid" id="archiveGrid" aria-label="Archived portraits"></div>
        </div>
        <footer class="screen-actions archive-actions">
          <button class="action action-secondary" id="archiveRefreshButton" type="button">Refresh</button>
          <button class="action action-primary" id="archiveBackButton" type="button">Back</button>
        </footer>
      </section>

      <dialog class="camera-dialog" id="cameraDialog">
        <form method="dialog">
          <p class="view-label">Camera</p>
          <select id="cameraSelect" aria-label="Camera source"></select>
          <menu>
            <button class="action action-secondary" value="cancel" type="submit">Close</button>
            <button class="action action-primary" id="applyCameraButton" value="default" type="submit">Use</button>
          </menu>
        </form>
      </dialog>
    </main>

    <script src="vendor/gifenc.global.js?v=14"></script>
    <script src="app.js?v=photobooth-39"></script>
  </body>
</html>
