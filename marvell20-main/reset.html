<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>MARVELL 20 Reset</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #efe5d2;
        --ink: #211b18;
        --soft: #6e5d51;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        display: grid;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.08em;
      }

      p {
        margin: 0;
        color: var(--soft);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MARVELL 20</h1>
      <p id="statusText">Returning to MARVELL 20...</p>
    </main>
    <script>
      const fallbackDestination = "./photobooth.html";
      const safeDestinations = new Set([
        "index.html",
        "invitation.html",
        "photobooth.html",
        "reservation.html",
      ]);
      const params = new URLSearchParams(window.location.search);
      const statusText = document.querySelector("#statusText");

      function getDestination() {
        const requested = params.get("to") || params.get("back") || fallbackDestination;
        const url = new URL(requested, window.location.href);
        const fileName = url.pathname.split("/").pop() || "index.html";

        if (url.origin !== window.location.origin || !safeDestinations.has(fileName)) {
          return new URL(fallbackDestination, window.location.href);
        }

        return url;
      }

      async function refreshBoothCache() {
        if ("serviceWorker" in navigator && params.get("refresh") === "1") {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window && params.get("refresh") === "1") {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
      }

      async function returnWithProgress() {
        const destination = getDestination();
        if (statusText) {
          statusText.textContent = params.get("refresh") === "1"
            ? "Refreshing cached files, then returning..."
            : "Returning with saved progress...";
        }
        await refreshBoothCache();
        destination.searchParams.set("cached", "1");
        window.location.replace(destination);
      }

      returnWithProgress().catch(() => {
        const destination = getDestination();
        destination.searchParams.set("cached", "1");
        window.location.replace(destination);
      });
    </script>
  </body>
</html>
